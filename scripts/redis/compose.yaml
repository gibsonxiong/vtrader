services:
  redis:
    image: redis:${REDIS_VERSION}
    container_name: vtrader-redis
    ports:
      - "${REDIS_PORT}:6379"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --bind
      - "0.0.0.0"
      - --protected-mode
      - "no"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
networks:
  default:
    name: vtrader-network

